[project]
name = "fieldlines"
dynamic = ["version"]
description = "Lignes de champ électrique et magnétique, équipotentielles, pour des figures de cours"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CC-BY-NC-SA-4.0"]
authors = [{ name = "Antonin Marchand" }]
keywords = [
    "lignes de champ",
    "électrostatique",
    "magnétostatique",
    "équipotentielles",
    "matplotlib",
    "enseignement",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Natural Language :: French",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/antnardo/fieldlines"
Repository = "https://github.com/antnardo/fieldlines"
Issues = "https://github.com/antnardo/fieldlines/issues"
Changelog = "https://github.com/antnardo/fieldlines/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# La version vit dans le module : une seule source, que la publication compare à
# l'étiquette de la release.
[tool.hatch.version]
path = "src/fieldlines/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldlines"]

# Le sdist : le code, les exemples et la documentation ; ni les tests ni uv.lock.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/LICENSE-CC-BY-NC-SA-4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
