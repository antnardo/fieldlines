# À la publication d'une release sur GitHub : vérifier que l'étiquette est la version
# du paquet, construire la roue et le sdist avec uv et les joindre à la release, puis
# les publier sur PyPI par « trusted publishing » (OpenID Connect, sans jeton), depuis
# l'environnement GitHub « pypi » déclaré comme éditeur de confiance sur pypi.org.
name: Publication

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  artefacts:
    name: Roue et sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: L'étiquette est la version du paquet
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run --no-project python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/fieldlines/__init__.py').read_text()).group(1))")
          echo "étiquette $tag, paquet $version"
          test "$tag" = "$version"
      - name: Construire la roue et le sdist
        run: uv build
      - run: uvx twine check dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Joindre les artefacts à la release
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    name: PyPI
    needs: artefacts
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fieldlines
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publier sur PyPI (trusted publishing, sans jeton)
        uses: pypa/gh-action-pypi-publish@release/v1
